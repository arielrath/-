    ['ולנסיה',7,1,1,5,'4–13',4],['מלאגה',8,0,4,4,'4–13',4]
  ];
  const rows=id==='real'?laLigaRows:israelRows;
  const club=id==='real'?'ריאל מדריד':'מכבי חיפה';
  box.innerHTML=`<p class="muted">טבלת ${id==='real'?'הליגה הספרדית':'ליגת העל בישראל'} · עונת 2026/27</p>
  <div style="overflow-x:auto"><table><thead><tr><th>#</th><th>קבוצה</th><th>מש׳</th><th>נצ׳</th><th>תיקו</th><th>הפ׳</th><th>שערים</th><th>נק׳</th></tr></thead>
  <tbody>${rows.map((r,i)=>`<tr class="${r[0]===club?'mine':''}"><td>${i+1}</td><td style="text-align:right;white-space:nowrap">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td>${r[5]}</td><td><b>${r[6]}</b></td></tr>`).join('')}</tbody></table></div>
  <p class="muted" style="font-size:11px;margin-top:10px">הנתונים מעודכנים ידנית לפי טבלאות שפורסמו ב־11.10.2026, ולכן ייתכן שינוי אחרי משחקים נוספים.</p>
  <p><a href="${id==='real'?'https://www.laliga.com/en-US/laliga-easports/standing':'https://www.365scores.com/he/football/league/premier-league-42/matches'}" target="_blank" rel="noopener">בדיקת הטבלה העדכנית באתר ↗</a></p>`;
}
function openTeam(id){selected=teams.find(t=>t.id===id);page='team';render();document.getElementById('nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.page==='teams'))}
function openMatch(h,a){selected={home:h,away:a};page='match';render()}
function renderDetail(){if(page==='team'){let t=selected;let ms=matches.filter(m=>m.home===t.name||m.away===t.name);return `<button class="back" onclick="go('teams')">→ חזרה לקבוצות</button><div class="panel"><div class="crest">${t.icon}</div><h2>${t.name}</h2><span class="pill">${t.sport} · ${t.league}</span><h3>משחקים</h3>${ms.length?ms.map(matchCard).join(''):'<p class="muted">לא נמצאו משחקים לדוגמה לקבוצה זו.</p>'}<h3 style="margin-top:22px">סגל שחקנים</h3>${t.players.map(p=>`<div class="newsitem">${p}</div>`).join('')}<h3 style="margin-top:22px">טבלת ליגה</h3><p class="muted">טבלה מלאה ועונות קודמות יופיעו לאחר חיבור מקור נתונים.</p><button class="filter" onclick="go('tables')">פתיחת טבלאות</button></div>`}return `<button class="back" onclick="go('games')">→ חזרה למשחקים</button><div class="panel"><span class="pill">פרטי משחק</span><h2>${selected.home} נגד ${selected.away}</h2><p class="muted">פרטי המשחק, אירועים והרכבים יוצגו כאן כאשר יהיו זמינים ממקור נתונים.</p><a href="https://www.liveball.co.il/" target="_blank" rel="noopener">פתיחת אתר Liveball ↗</a><p class="muted" style="font-size:12px">הקישור פותח את האתר הכללי, ולא מבטיח שידור של המשחק המסוים.</p></div>`}
function render(){if(page==='games')app.innerHTML=renderGames();else if(page==='teams')app.innerHTML=renderTeams();else if(page==='news')app.innerHTML=renderNews();else if(page==='tables'){app.innerHTML=renderTables();renderTableData()}else app.innerHTML=renderDetail()}
function go(p){page=p;selected=null;document.getElementById('nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();window.scrollTo(0,0)}
function filterSport(s){document.querySelectorAll('#matchlist .match').forEach((el,i)=>{let m=[...matches].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));el.style.display=s==='all'||m[i]?.sport===s?'':'none'})}
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});
render();
</script></body></html>
